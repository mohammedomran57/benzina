<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وقود | Fuel station observatory</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"></head>
<body><header><a class="brand" href="./index.html"><span class="brand-icon">⛽</span><span><b data-ar="وقود" data-en="WAQOOD"></b><small data-ar="مرصد محطات الوقود · ليبيا" data-en="Libya · Fuel station observatory"></small></span></a><button id="language">English</button></header>
<div class="demo" data-ar="نموذج تجريبي للعرض على وزارة النفط والغاز · بيانات المحطات توضيحية وليست مباشرة · لا تُرسل البلاغات إلى الوزارة" data-en="Prototype for Ministry of Oil & Gas review · Illustrative station data, not live · Reports are not sent to the ministry"></div>
<main><section class="hero"><div><span class="eyebrow" data-ar="رحلة أوضح، انتظار أقل" data-en="PLAN YOUR STOP. SAVE YOUR TIME."></span><h1 data-ar="اعرف قبل ما تمشي." data-en="Know before you go."></h1><p data-ar="تابع توفر الوقود وحالة المحطات والازدحام في مكان واحد." data-en="Fuel availability, station opening status and queues. All in one place."></p></div><div class="scope"><span data-ar="نطاق العرض التجريبي" data-en="DEMO COVERAGE"></span><strong data-ar="طرابلس الكبرى" data-en="Greater Tripoli"></strong><small data-ar="٦ محطات · بيانات نموذجية" data-en="6 stations · Sample dataset"></small></div></section>
<nav aria-label="Main"><button class="active" data-tab="stations" data-ar="دليل المحطات" data-en="Find fuel"></button><button data-tab="reports" data-ar="بلاغاتي" data-en="My reports"></button><button data-tab="operations" data-ar="لوحة المتابعة" data-en="Operations"></button></nav>
<section id="stations" class="panel"><div id="summary" class="stats"></div><div class="toolbar"><label class="search"><span data-ar="البحث عن محطة" data-en="Find a station"></span><input id="search" type="search" data-ph-ar="اسم المحطة أو المنطقة…" data-ph-en="Station or district…"></label><label><span data-ar="نوع الوقود" data-en="Fuel"></span><select id="fuel"><option value="all" data-ar="كل الأنواع" data-en="All fuels"></option><option value="gas95" data-ar="بنزين 95" data-en="Gasoline 95"></option><option value="diesel" data-ar="ديزل" data-en="Diesel"></option></select></label><label><span data-ar="الترتيب" data-en="Sort by"></span><select id="sort"><option value="wait" data-ar="أقل انتظار" data-en="Shortest queue"></option><option value="fresh" data-ar="أحدث تحديث" data-en="Latest update"></option><option value="near" data-ar="الأقرب إليّ" data-en="Nearest to me"></option></select></label><button id="locate" data-ar="◎ استخدم موقعي" data-en="◎ Use my location"></button></div><div class="filters"><label><input type="checkbox" id="openOnly"><span data-ar="المفتوحة فقط" data-en="Open only"></span></label><label><input type="checkbox" id="savedOnly"><span data-ar="المحفوظة فقط" data-en="Saved only"></span></label><span id="resultCount" aria-live="polite"></span></div><div id="cards" class="cards"></div><p class="footnote" data-ar="الانتظار تقديري. تحديث أقدم من ٣٠ دقيقة يحتاج إلى تأكيد. المسافة خط مستقيم وليست وقت قيادة." data-en="Wait times are estimates. Updates older than 30 minutes need confirmation. Distance is straight-line, not driving time."></p></section>
<section id="reports" class="panel" hidden><div class="section-heading"><div><h2 data-ar="بلاغاتك، في مكان واحد" data-en="Your reports, in one place"></h2><p data-ar="حفظ محلي على هذا المتصفح فقط. لا توجد إحالة فعلية أو متابعة وزارية." data-en="Saved in this browser only. No actual dispatch or ministry review."></p></div><button id="newReport" class="primary" data-ar="+ بلاغ جديد" data-en="+ New report"></button></div><div id="reportList"></div></section>
<section id="operations" class="panel" hidden><div class="section-heading"><div><h2 data-ar="صورة أوضح لحالة المحطات" data-en="A clearer view of station conditions"></h2><p data-ar="لوحة عرض تجريبية · جميع المؤشرات محسوبة من بيانات النموذج" data-en="Demo dashboard · Metrics derived from the sample dataset"></p></div><button id="export" data-ar="تنزيل البيانات CSV" data-en="Download CSV"></button><button id="print" data-ar="طباعة / PDF" data-en="Print / PDF"></button></div><div id="opsStats" class="stats"></div><div class="ops-grid"><article class="box"><h3 data-ar="محطات تحتاج إلى متابعة" data-en="Stations needing attention"></h3><div id="alerts"></div></article><article class="box"><span class="eyebrow" data-ar="محاكاة توضيحية وليست تنبؤاً معتمداً" data-en="ILLUSTRATIVE SIMULATION · NOT A VALIDATED FORECAST"></span><h3 data-ar="ماذا لو تغيّر الإمداد؟" data-en="What if supply changes?"></h3><label><span data-ar="تغير الإمداد (%)" data-en="Supply change (%)"></span><input id="supply" type="range" min="-40" max="40" value="0" step="5"><output id="supplyValue">0%</output></label><div id="scenario"></div><p data-ar="تقدير افتراضي: متوسط انتظار المحطات المفتوحة ÷ (١ + تغير الإمداد). لا يشمل الطلب أو النقل أو المخزون." data-en="Illustration: mean open-station wait ÷ (1 + supply change). Excludes demand, transport and inventory."></p></article></div></section>
<footer><span data-ar="وقود · تصميم لخدمة المواطن" data-en="WAQOOD · Designed around citizens"></span><span data-ar="نسخة تجريبية 01" data-en="PROTOTYPE 01"></span></footer></main>
<dialog id="reportDialog"><form id="reportForm"><div class="section-heading"><h2 data-ar="إضافة بلاغ" data-en="Add a report"></h2><button type="button" id="closeDialog" aria-label="Close">×</button></div><p data-ar="يُحفظ البلاغ محلياً دون تغيير بيانات المحطة المعروضة. لا تضف معلومات شخصية." data-en="Reports are saved locally without changing displayed station data. Do not include personal information."></p><label><span data-ar="المحطة" data-en="Station"></span><select id="reportStation" required></select></label><label><span data-ar="نوع البلاغ" data-en="Report type"></span><select id="reportType"><option value="closure" data-ar="إغلاق غير متوقع" data-en="Unexpected closure"></option><option value="fuel" data-ar="نفاد الوقود" data-en="Fuel unavailable"></option><option value="queue" data-ar="ازدحام / سوء تنظيم" data-en="Congestion / queue management"></option><option value="other" data-ar="ملاحظة أخرى" data-en="Other observation"></option></select></label><label><span data-ar="التفاصيل" data-en="Details"></span><textarea id="details" minlength="10" maxlength="1000" rows="4" required></textarea></label><button class="primary" type="submit" data-ar="حفظ البلاغ التجريبي" data-en="Save demo report"></button></form></dialog><div id="toast" role="status" aria-live="polite" hidden></div><script src="stations.js"></script><script src="app.js"></script><script src="forecast.js"></script><script src="enhancements.js"></script></body></html>
