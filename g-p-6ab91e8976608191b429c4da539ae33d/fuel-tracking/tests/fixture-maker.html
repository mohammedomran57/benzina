<!doctype html><html lang="en"><meta charset="utf-8"><title>Camera pipeline test fixture builder</title><body><h1>Detector pipeline test only</h1><p>This creates a repeated still-image video, not real queue footage. Do not use it to claim field accuracy.</p><button id="make">Generate 20-second test video</button><p id="status">Ready</p><canvas id="canvas" width="480" height="640"></canvas><img id="image" src="bus-test.jpg" hidden><script>
document.getElementById('make').onclick=async()=>{const status=document.getElementById('status'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),image=document.getElementById('image');
try{await image.decode();document.getElementById('make').disabled=true;ctx.drawImage(image,0,0,480,640);const stream=canvas.captureStream(5),parts=[];const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:500000});recorder.ondataavailable=e=>parts.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(draw);const blob=new Blob(parts,{type:'video/webm'});const response=await fetch('/test-fixture',{method:'POST',body:blob});status.textContent=response.ok?'Fixture saved: tests/detector-still-fixture.webm':'Failed to save fixture';};const draw=setInterval(()=>ctx.drawImage(image,0,0,480,640),200);recorder.start();status.textContent='Recording repeated image for 20 seconds…';setTimeout(()=>recorder.stop(),20000);}catch(error){status.textContent=error.message;}};
</script></body></html>
