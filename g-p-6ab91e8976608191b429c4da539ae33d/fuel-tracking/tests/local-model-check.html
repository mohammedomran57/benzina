<!doctype html><meta charset="utf-8"><title>Local model check</title><button id="test">Test local detector</button><pre id="result">Ready</pre><script src="../vendor/tf.min.js"></script><script src="../vendor/coco-ssd.min.js"></script><script>document.querySelector('#test').onclick=async()=>{const r=document.querySelector('#result');r.textContent='Loading';try{await tf.ready();const m=await cocoSsd.load({base:'lite_mobilenet_v2',modelUrl:'../vendor/model/model.json'});const image=new Image();image.src='bus-test.jpg';await image.decode();const p=await m.detect(image);r.textContent=JSON.stringify({status:'PASS',backend:tf.getBackend(),detections:p},null,2);m.dispose();}catch(e){r.textContent='FAIL: '+e.message;}};</script>
