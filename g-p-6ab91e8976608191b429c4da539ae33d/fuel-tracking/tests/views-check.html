<!doctype html><meta charset="utf-8"><button id="go">Compare detector views</button><pre id="out">Ready</pre><canvas id="frame"></canvas><script src="../vendor/tf.min.js"></script><script src="../vendor/coco-ssd.min.js"></script><script src="../vehicle-views.js"></script><script>go.onclick=async()=>{try{out.textContent='Loading';const image=new Image();image.src='queue-screenshot.png';await image.decode();frame.width=446;frame.height=769;const c=frame.getContext('2d');c.drawImage(image,340,151,446,769,0,0,446,769);const model=await cocoSsd.load({base:'lite_mobilenet_v2',modelUrl:'../vendor/model/model.json'});const old=await model.detect(frame,100,.5);const start=performance.now();const improved=await VehicleViews.detect(model,frame,[.24,.08,.72,.99],.5);out.textContent=JSON.stringify({image:[image.width,image.height],before:old.filter(p=>p.class==='car'),after:improved,ms:performance.now()-start},null,2);improved.forEach(p=>{c.strokeStyle='red';c.strokeRect(...p.bbox);});}catch(e){out.textContent=e.stack;}};</script>
